<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5DADE2">
    <title>Loading GazLite...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #5DADE2 0%, #4facfe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
            color: white;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .logo-text {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .status-text {
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .debug-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            max-width: 90%;
            text-align: center;
            display: none;
        }

        .launch-recovery{max-width:32rem;margin:20px;padding:20px;border-radius:14px;background:#fff;color:#173c50;line-height:1.5}
        .launch-recovery[hidden]{display:none}.launch-recovery button{margin-top:12px;min-height:44px;padding:10px 20px;border:0;border-radius:8px;background:#086b97;color:#fff;font:inherit;cursor:pointer}
        .debug-info.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="logo">
            <div class="logo-text">💨</div>
        </div>
        <h1 style="font-size: 32px; margin-bottom: 10px;">GazLite</h1>
        <p class="status-text" id="statusText">Initializing...</p>
        <div class="spinner" id="launchSpinner"></div>
        <div class="launch-recovery" id="launchRecovery" hidden>
            <p>Open Gaz Lite online at this same address to finish offline setup. Your saved data and pending transactions are kept.</p>
            <button type="button" id="retryLaunch">Try again</button>
        </div>
    </div>

    <div class="debug-info" id="debugInfo"></div>

    <script>
    (function () {
        'use strict';
        const base = window.location.pathname.replace(/\/pwa-launcher\.html$/, '').replace(/\/$/, '');
        let launching = false;
        const node = id => document.getElementById(id);
        const status = text => { node('statusText').textContent = text; };
        function recover() {
            status('Offline setup is not ready yet. Connect at this same address and try again.');
            node('launchSpinner').hidden = true;
            node('launchRecovery').hidden = false;
            launching = false;
        }
        function signedIn() {
            try {
                const saved = localStorage.getItem('offlineUser');
                const user = saved ? JSON.parse(saved) : { id: localStorage.getItem('current_user_id'), role: localStorage.getItem('current_user_role') };
                const id = Number(user && user.id), timestamp = user && user.loginTime && Date.parse(user.loginTime);
                return Number.isSafeInteger(id) && id > 0 && typeof user.role === 'string' && !!user.role.trim() &&
                    (!user.loginTime || (Number.isFinite(timestamp) && Date.now() - timestamp <= 24 * 60 * 60 * 1000));
            } catch (_) { return false; }
        }
        async function connected() {
            if (!navigator.onLine) return false;
            const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 3000);
            try { return (await fetch(base + '/manifest.json', { method: 'HEAD', cache: 'no-store', signal: controller.signal })).ok; }
            catch (_) { return false; }
            finally { clearTimeout(timer); }
        }
        function readiness(worker) {
            return new Promise(resolve => {
                const channel = new MessageChannel();
                const timer = setTimeout(() => { channel.port1.close(); resolve(null); }, 3000);
                channel.port1.onmessage = event => {
                    clearTimeout(timer); channel.port1.close();
                    resolve(event.data && typeof event.data.ready === 'boolean' ? event.data.ready : null);
                };
                try { worker.postMessage({ type: 'GET_OFFLINE_STATUS' }, [channel.port2]); }
                catch (_) { clearTimeout(timer); channel.port1.close(); resolve(false); }
            });
        }
        function activated(registration) {
            const worker = registration.installing || registration.waiting || registration.active;
            if (!worker) return Promise.resolve(null);
            if (worker.state === 'activated') return Promise.resolve(worker);
            return new Promise(resolve => {
                const done = value => { clearTimeout(timer); worker.removeEventListener('statechange', changed); resolve(value); };
                const changed = () => {
                    if (worker.state === 'activated') done(worker);
                    else if (worker.state === 'redundant') done(null);
                };
                const timer = setTimeout(() => done(null), 15000);
                worker.addEventListener('statechange', changed); changed();
            });
        }
        async function prepare() {
            if (!navigator.serviceWorker) return false;
            let timer;
            const setup = async () => {
                const registration = await navigator.serviceWorker.register(base + '/sw.js', { scope: base + '/', updateViaCache: 'none' });
                await registration.update();
                const worker = await activated(registration);
                return worker && await readiness(worker) === true;
            };
            try { return await Promise.race([setup(), new Promise(resolve => { timer = setTimeout(() => resolve(false), 20000); })]); }
            catch (_) { return false; }
            finally { clearTimeout(timer); }
        }
        async function available() {
            if (!navigator.serviceWorker) return false;
            try {
                const registration = await navigator.serviceWorker.getRegistration(base + '/');
                const worker = registration && registration.active;
                return worker && (await readiness(worker)) !== false;
            } catch (_) { return false; }
        }
        async function launch() {
            if (launching) return;
            launching = true;
            status('Checking connection…');
            let online = await connected();
            if (online) { status('Preparing offline pages…'); await prepare(); online = await connected(); }
            if (online) {
                status('Loading online version…');
                window.location.replace(base + (signedIn() ? '/home' : '/login'));
            } else if (await available()) {
                status('Loading saved offline version…');
                window.location.replace(base + '/offline/' + (signedIn() ? 'home.html' : 'login.html'));
            } else recover();
        }
        function start() { launch().catch(recover); }
        node('retryLaunch').onclick = () => { node('launchRecovery').hidden = true; node('launchSpinner').hidden = false; start(); };
        window.addEventListener('online', start);
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true }); else start();
    })();
    </script>
</body>
</html>
