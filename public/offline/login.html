    <!-- Role Selection & Form Scripts -->
    <script>
    let currentRole = '';

    document.addEventListener('DOMContentLoaded', function() {
        const hasErrors = document.querySelector('.error-text') || document.querySelector('.alert-error');
        const selectedRoleInput = document.getElementById('selectedRoleInput');
        
        if (hasErrors && selectedRoleInput && selectedRoleInput.value) {
            currentRole = selectedRoleInput.value;
            updateLoginFormRole();
        }
    });

    function showRoleSelection() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('roleSelectionPage').style.display = 'flex';
        document.getElementById('loginFormPage').style.display = 'none';
        
        currentRole = '';
        clearRoleSelection();
        clearAllErrors();
    }

    function selectRole(role) {
        currentRole = role.charAt(0).toUpperCase() + role.slice(1).toLowerCase();
        
        clearRoleSelection();
        clearAllErrors();
        
        const selectedButton = document.querySelector(`.${role}-btn`);
        const checkmark = selectedButton.querySelector('.selected-indicator');
        
        selectedButton.classList.add('selected');
        checkmark.style.display = 'inline';
        
        setTimeout(() => {
            showLoginForm();
        }, 300);
    }

    function clearRoleSelection() {
        document.querySelectorAll('.role-button').forEach(button => {
            button.classList.remove('selected');
            const checkmark = button.querySelector('.selected-indicator');
            if (checkmark) {
                checkmark.style.display = 'none';
            }
        });
    }

    function clearAllErrors() {
        document.querySelectorAll('.error-text').forEach(error => {
            error.style.display = 'none';
        });
        
        document.querySelectorAll('.form-input.error').forEach(input => {
            input.classList.remove('error');
            input.style.backgroundColor = '#F5F5F5';
            input.style.border = 'none';
        });
        
        document.querySelectorAll('.form-input').forEach(input => {
            if (input.name !== 'selected_role') {
                input.value = '';
            }
        });
        
        const selectedRoleInput = document.getElementById('selectedRoleInput');
        if (selectedRoleInput) {
            selectedRoleInput.value = '';
        }
    }

    function showLoginForm() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('roleSelectionPage').style.display = 'none';
        document.getElementById('loginFormPage').style.display = 'flex';
        
        updateLoginFormRole();
    }

    function updateLoginFormRole() {
        const roleIndicator = document.getElementById('roleIndicator');
        const roleName = document.getElementById('selectedRoleName');
        const signinButton = document.getElementById('signinButton');
        const selectedRoleInput = document.getElementById('selectedRoleInput');
        
        if (currentRole) {
            roleIndicator.style.display = 'block';
            roleName.textContent = currentRole.charAt(0).toUpperCase() + currentRole.slice(1);
            signinButton.textContent = `Sign in`;
            
            selectedRoleInput.value = currentRole;
        }
    }

    function showLandingPage() {
        document.getElementById('loginFormPage').style.display = 'none';
        document.getElementById('roleSelectionPage').style.display = 'none';
        document.getElementById('landingPage').style.display = 'flex';
        
        currentRole = '';
        clearAllErrors();
    }
    </script>

    <!-- IndexedDB Login Scripts -->
    <script>
    let offlineLoginPending = false;
    window.addEventListener('offline-before-update', event => {
        const identifier = document.getElementById('email');
        const password = document.getElementById('password');
        // Credentials remain in this document only. Finish or clear the form
        // before an automatic update replaces the page.
        if (offlineLoginPending || (identifier && identifier.value) || (password && password.value)) event.preventDefault();
    });
    async function handleOfflineLogin(event) {
        event.preventDefault();
        if (offlineLoginPending) return;
        const button = document.getElementById('signinButton');
        const loader = document.getElementById('loader');
        const identifier = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const role = document.getElementById('selectedRoleInput').value;
        offlineLoginPending = true;
        button.disabled = true;
        button.textContent = 'Checking saved account…';
        if (loader) loader.style.display = 'none';
        try {
            if (!window.OfflineAuth) throw new Error('Offline sign-in files are not ready. Connect and update the offline version.');
            const user = await OfflineAuth.authenticate(identifier, password, role);
            OfflineAuth.startSession(user);
            document.getElementById('password').value = '';
            if (loader) loader.style.display = 'none';
            await Swal.fire({ icon: 'success', title: 'Signed in offline', text: 'Welcome back, ' + user.name + '!', timer: 900, showConfirmButton: false });
            window.location.href = 'home.html';
        } catch (error) {
            if (loader) loader.style.display = 'none';
            await Swal.fire({ icon: 'error', title: 'Offline sign-in', text: error.message || 'Unable to verify this saved account.', confirmButtonColor: '#5DADE2' });
        } finally {
            offlineLoginPending = false;
            button.disabled = false;
            button.textContent = 'Sign in';
            if (loader) loader.style.display = 'none';
        }
    }
    </script>

    <script>
        const networkStatus = document.getElementById('networkStatus');
        const networkStatusText = document.getElementById('networkStatusText');
        let isActuallyOnline = navigator.onLine;
        let networkCheckInterval = null;

        async function checkRealNetworkStatus() {
            if (!navigator.onLine) return false;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);
            try {
                const response = await fetch(new URL('../manifest.json', window.location.href).href, { method: 'HEAD', cache: 'no-store', signal: controller.signal });
                return response.ok;
            } catch (error) { return false; }
            finally { clearTimeout(timeoutId); }
        }

        async function updateNetworkStatusWithCheck() {
            const actuallyOnline = await checkRealNetworkStatus();
            const previousStatus = isActuallyOnline;
            isActuallyOnline = actuallyOnline;
            networkStatus.className = 'network-status ' + (actuallyOnline ? 'online' : 'offline');
            networkStatusText.textContent = actuallyOnline ? 'Connected' : 'Offline';
            if (actuallyOnline && !previousStatus) window.dispatchEvent(new CustomEvent('offline-connection-restored'));
        }

        function redirectToOnline() {
            Swal.fire({
                icon: 'success',
                title: 'Switching to Online Mode',
                text: 'Redirecting to online version...',
                timer: 1500,
                showConfirmButton: false,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            }).then(() => {
                const basePath = window.location.pathname.includes('/crms-risev2/public') ? '/crms-risev2/public' : '';
                window.location.href = basePath + '/login';
            });
        }

        async function toggleNetworkMode() {
            const actuallyOnline = await checkRealNetworkStatus();
            
            if (!actuallyOnline) {
                Swal.fire({
                    icon: 'warning',
                    title: 'No Internet Connection',
                    html: `
                        <div style="text-align: center; padding: 15px;">
                            <p style="font-size: 16px; margin-bottom: 20px;">
                                📵 You are currently offline
                            </p>
                            <p style="font-size: 14px; color: #666; margin-bottom: 15px;">
                                To go online, please:
                            </p>
                            <ul style="text-align: left; font-size: 14px; color: #666; margin: 0 auto; max-width: 250px;">
                                <li>Turn on WiFi, or</li>
                                <li>Enable mobile data</li>
                            </ul>
                            <p style="font-size: 13px; color: #999; margin-top: 20px;">
                                The app will automatically detect when your connection is restored.
                            </p>
                        </div>
                    `,
                    confirmButtonText: 'OK',
                    confirmButtonColor: '#5BC2E7'
                });
                return;
            }
            
            Swal.fire({
                title: 'Switch to Online Mode?',
                html: `
                    <div style="text-align: center; padding: 15px;">
                        <p style="font-size: 16px; margin-bottom: 15px;">
                            🟢 <strong>Internet Connected</strong>
                        </p>
                        <p style="font-size: 14px; color: #666; margin-bottom: 20px;">
                            You have an active internet connection. Would you like to switch to the online version?
                        </p>
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; font-size: 13px; color: #666;">
                            <i class="bi bi-info-circle"></i> Online mode provides real-time sync and additional features
                        </div>
                    </div>
                `,
                icon: 'question',
                showDenyButton: true,
                showCancelButton: false,
                confirmButtonText: '<i class="bi bi-wifi"></i> Go Online',
                denyButtonText: '<i class="bi bi-wifi-off"></i> Stay Offline',
                confirmButtonColor: '#2ecc71',
                denyButtonColor: '#6c757d'
            }).then((result) => {
                if (result.isConfirmed) {
                    redirectToOnline();
                } else if (result.isDenied) {
                    Swal.fire({
                        icon: 'info',
                        title: 'Staying Offline',
                        text: 'You will continue using offline mode.',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }
            });
        }

        networkCheckInterval = setInterval(updateNetworkStatusWithCheck, 3000);
        updateNetworkStatusWithCheck();

        window.addEventListener('beforeunload', () => {
            if (networkCheckInterval) {
                clearInterval(networkCheckInterval);
            }
        });
    </script>

</body>
</html>
